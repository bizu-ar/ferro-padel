<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture · Torneo de Pádel – Medios de Comunicación – Ferro Pádel</title>
<meta name="description" content="Fixture del Torneo de Pádel Medios de Comunicación en Ferro Pádel, Formosa. 13, 14 y 15 de noviembre de 2026.">
<meta name="theme-color" content="#105ca2">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bizu-ar.github.io/ferro-padel/">
<meta property="og:title" content="Fixture · Torneo de Pádel – Medios de Comunicación – Ferro Pádel">
<meta property="og:description" content="13, 14 y 15 de noviembre de 2026 · Complejo Ferro Pádel · Damas, Masc A y Masc B.">
<meta property="og:image" content="https://bizu-ar.github.io/ferro-padel/flyer.png">
<meta property="og:image:width" content="1080">
<meta property="og:image:height" content="1350">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fixture · Torneo de Pádel – Medios de Comunicación – Ferro Pádel">
<meta name="twitter:image" content="https://bizu-ar.github.io/ferro-padel/flyer.png">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&amp;family=Montserrat:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--g:#1aa469;--b:#105ca2;--o:#bf6029;--n:#0b1d3a;--h:#0857a2;--bg:#f6f8fb;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--n);line-height:1.45}
h1,h2,h3{font-family:Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;color:var(--h);letter-spacing:.5px}
.stripe{height:10px;background:linear-gradient(90deg,var(--g) 0 33.3%,var(--b) 33.3% 66.6%,var(--o) 66.6%)}
header{background:#fff;text-align:center;padding:12px 16px 14px;position:relative;overflow:hidden}
header:before,header:after{content:"";position:absolute;width:140px;height:32px;transform:rotate(-35deg)}
header:before{left:-64px;top:12px;background:linear-gradient(90deg,var(--g),var(--b))}
header:after{right:-64px;bottom:8px;background:linear-gradient(90deg,var(--b),var(--o))}
header>*{position:relative;z-index:1}
header img{width:min(132px,34vw);height:auto}
header h1{font-size:1.55rem;line-height:1.05;margin:.25em 0 .05em}
.sub{font-weight:800;font-size:.78rem;letter-spacing:.4px}
.date{display:inline-block;margin-top:8px;background:var(--n);color:#fff;font-weight:800;padding:7px 12px;border-radius:10px;border-bottom:5px solid var(--o);font-size:.92rem}
header p{margin:.35em 0 0;font-size:.92rem}
@media(min-width:640px){
  header{padding:28px 20px 36px}
  header:before,header:after{width:260px;height:60px}
  header:before{left:-90px;top:40px}
  header:after{right:-90px;bottom:40px}
  header img{width:min(260px,62vw)}
  header h1{font-size:3rem}
  .sub{font-size:1.05rem;letter-spacing:1px}
}
main{max-width:980px;margin:0 auto;padding:8px 16px 40px}
h2{font-size:1.7rem;margin:14px 0 0;padding-left:12px;border-left:8px solid var(--g)}
h2.cat-masc-a{border-left-color:var(--b)}
h2.cat-masc-b{border-left-color:var(--o)}
.kicker{margin:.35em 0 .2em;font-weight:800}
.note{font-size:.85rem;color:#5b6b7c;margin:.2em 0 .8em}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(246,248,251,.96);padding:10px 0 8px;margin:0 -16px 8px;padding-left:16px;padding-right:16px}
.seg{display:flex;gap:6px}
.seg + .seg{margin-top:6px}
.seg button{flex:1 1 0;min-width:0;min-height:44px;border-radius:10px;border:2px solid #d5dde8;background:#fff;color:var(--n);font:inherit;font-weight:800;font-size:.82rem;line-height:1.15;padding:6px 4px;cursor:pointer}
.seg button small{display:block;font-weight:700;font-size:.72rem;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--b);border-color:var(--b);color:#fff}
.seg.cats button[aria-pressed="true"][data-cat="damas"]{background:var(--g);border-color:var(--g)}
.seg.cats button[aria-pressed="true"][data-cat="masc-b"]{background:var(--o);border-color:var(--o)}
.seg.view button{min-height:38px}
.seg.view button[aria-pressed="true"]{background:var(--n);border-color:var(--n)}
.seg button:focus-visible,.pair:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.match-list,.zona-list{display:grid;gap:12px}
.match{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(11,29,58,.08);border-top:6px solid var(--b)}
.match.cat-damas{border-top-color:var(--g)}
.match.cat-masc-b,.zona-card.cat-masc-b{border-top-color:var(--o)}
.match.cat-damas.zona-card,.zona-card.cat-damas{border-top-color:var(--g)}
.match-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.time{font-weight:800;font-size:1.05rem}
.chip{background:#eef5ff;color:var(--h);font-weight:800;border-radius:999px;padding:2px 8px;font-size:.78rem}
.court{margin-left:auto;font-weight:800;color:var(--o)}
.pair{display:block;width:100%;text-align:left;background:#f4f7fb;border:2px solid transparent;border-radius:10px;padding:10px 12px;color:inherit;font:inherit}
button.pair{cursor:pointer}
button.pair:active{transform:scale(.99)}
.pair.winner{background:#e8f8ef;border-color:var(--g)}
.pair-name{display:block;font-weight:800;line-height:1.3}
.pair-slot{display:block;margin-top:2px;font-size:.75rem;font-weight:700;color:#5b6b7c}
.won{display:inline-block;background:var(--g);color:#fff;font-size:.68rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 6px;margin-bottom:4px}
.vs{text-align:center;font-weight:800;color:var(--o);font-size:.78rem;letter-spacing:.08em;margin:4px 0}
.resultado{margin-top:10px}
.resultado-label,.score-label{display:block;font-size:.75rem;font-weight:800;color:#5b6b7c;text-transform:uppercase;letter-spacing:.04em}
.resultado-value{font-weight:800}
.resultado-value.empty{color:#8aa0b5;font-weight:700}
.score-label input{width:100%;margin-top:4px;padding:12px;border:2px solid #d5dde8;border-radius:10px;font:inherit;font-size:16px;color:var(--n)}
.score-label input:focus{outline:none;border-color:var(--b)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--b);color:#fff;font-weight:800;border:0;border-radius:10px;padding:12px 16px;font-size:.95rem;cursor:pointer;text-decoration:none;font-family:inherit}
.btn-clear{width:100%;margin-top:8px;background:#fff;color:var(--o);border:2px solid var(--o)}
.btn[disabled]{opacity:.6;cursor:progress}
.save-status{margin:8px 0 0;font-size:.8rem;font-weight:800;min-height:1em}
.save-status.saving{color:var(--b)}
.save-status.saved{color:var(--g)}
.save-status.error{color:#9d2c2c}
.admin-banner{background:var(--n);color:#fff;border-radius:12px;padding:10px 12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.admin-banner p{margin:0;font-size:.85rem;font-weight:700}
.admin-banner .btn{background:#fff;color:var(--n);padding:8px 10px;font-size:.8rem}
.zona-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 16px rgba(11,29,58,.08);border-top:6px solid var(--b)}
.zona-card h3{margin:0 0 .4em;font-size:1.25rem}
.zona-card ol{margin:0;padding-left:1.2rem}
.zona-card li{margin:.35em 0;font-weight:700}
.admin-banner[hidden],.pin-form[hidden],.toast[hidden]{display:none !important}
.pin-form{display:flex;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:10px;margin-top:12px;box-shadow:0 4px 16px rgba(11,29,58,.08);border-top:6px solid var(--o)}
.pin-form label{font-weight:800;font-size:.85rem}
.pin-form input{flex:1;min-width:0;padding:10px 12px;border:2px solid #d5dde8;border-radius:10px;font:inherit;font-size:16px;color:var(--n)}
.pin-form input:focus{outline:none;border-color:var(--b)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--n);color:#fff;font-weight:800;padding:10px 16px;border-radius:999px;z-index:30;box-shadow:0 8px 24px rgba(11,29,58,.28);max-width:calc(100% - 32px);text-align:center}
footer{text-align:center;padding:20px;color:#5b6b7c;font-size:.9rem}
@media(min-width:860px){
  .match-list,.zona-list{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
<img src="logo.png" alt="Logo Torneo de Pádel Medios de Comunicación Formosa 2026" width="260" height="323">
<h1>Torneo de Pádel</h1>
<div class="sub">MEDIOS DE COMUNICACIÓN · FORMOSA 2026</div>
<div class="date">13, 14 y 15 de noviembre de 2026</div>
<p>Complejo Ferro Pádel · Formosa</p>
</header>
<div class="stripe"></div>
<main>
<section id="fixture">
<h2 id="panel-title">Fixture</h2>
<div class="admin-banner" id="admin-banner" hidden>
<p>Modo organización. Cada resultado se guarda en el repositorio.</p>
<button class="btn" id="leave-admin" type="button">Salir</button>
</div>
<form id="pin-form" class="pin-form" hidden>
<label for="pin-input">PIN</label>
<input id="pin-input" type="password" inputmode="numeric" autocomplete="off" spellcheck="false" autocapitalize="off" maxlength="16" enterkeyhint="go">
<button class="btn" type="submit">Entrar</button>
</form>
<div class="toolbar">
<div class="seg" id="day-filters" role="group" aria-label="Día"></div>
<div class="seg cats" id="cat-filters" role="group" aria-label="Categoría"></div>
<div class="seg view" id="view-filters" role="group" aria-label="Vista">
<button type="button" data-view="partidos" aria-pressed="true">Partidos</button>
<button type="button" data-view="zonas" aria-pressed="false">Zonas</button>
</div>
</div>
<p class="kicker" id="panel-kicker"></p>
<p class="note" id="panel-note"></p>
<div id="panel"></div>
</section>
</main>
<div class="stripe"></div>
<footer>Torneo de Pádel – Medios de Comunicación – Formosa 2026 · Complejo Ferro Pádel</footer>
<p id="pin-toast" class="toast" hidden role="status"></p>
<noscript><p style="padding:16px">Activá JavaScript para ver el fixture.</p></noscript>
<script src="fixture-data.js"></script>
<script src="fixture-logic.js"></script>
<script src="results-store.js"></script>
<script src="admin-auth.js"></script>
<script>
(function () {
  var fixture = globalThis.FIXTURE;
  var logic = globalThis.FixtureLogic;
  var store = globalThis.ResultsStore;
  var params = new URLSearchParams(location.search);
  var state = {
    day: "viernes",
    category: "damas",
    view: "partidos",
    admin: false,
    results: { v: 1, matches: {} },
    saving: {},
    status: {},
    pinned: {},
    loadError: ""
  };
  var byId = {};
  fixture.matches.forEach(function (match) { byId[match.id] = match; });

  var title = document.getElementById("panel-title");
  var kicker = document.getElementById("panel-kicker");
  var note = document.getElementById("panel-note");
  var panel = document.getElementById("panel");
  var dayFilters = document.getElementById("day-filters");
  var catFilters = document.getElementById("cat-filters");
  var pinForm = document.getElementById("pin-form");
  var pinInput = document.getElementById("pin-input");
  var adminBanner = document.getElementById("admin-banner");
  var toastTimer = 0;

  function readRoute() {
    var parts = (location.hash || "").replace(/^#/, "").split("/");
    if (fixture.days.some(function (day) { return day.id === parts[0]; })) state.day = parts[0];
    if (fixture.categories.some(function (cat) { return cat.id === parts[1]; })) state.category = parts[1];
    if (parts[2] === "zonas" || parts[2] === "partidos") state.view = parts[2];
  }

  function writeRoute() {
    var hash = "#" + state.day + "/" + state.category + "/" + state.view;
    if (location.hash === hash) return;
    history.replaceState(null, "", location.pathname + location.search + hash);
  }

  function dayMeta(id) {
    return fixture.days.filter(function (day) { return day.id === id; })[0];
  }
  function catMeta(id) {
    return fixture.categories.filter(function (cat) { return cat.id === id; })[0];
  }

  function buildFilters() {
    fixture.days.forEach(function (day) {
      var button = document.createElement("button");
      button.type = "button";
      button.dataset.day = day.id;
      var name = document.createElement("span");
      name.textContent = day.label;
      var date = document.createElement("small");
      date.textContent = day.date;
      button.appendChild(name);
      button.appendChild(date);
      dayFilters.appendChild(button);
    });
    fixture.categories.forEach(function (cat) {
      var button = document.createElement("button");
      button.type = "button";
      button.dataset.cat = cat.id;
      button.textContent = cat.label;
      catFilters.appendChild(button);
    });
  }

  function syncFilters() {
    Array.prototype.forEach.call(dayFilters.querySelectorAll("button"), function (button) {
      button.setAttribute("aria-pressed", state.view === "partidos" && button.dataset.day === state.day ? "true" : "false");
    });
    Array.prototype.forEach.call(catFilters.querySelectorAll("button"), function (button) {
      button.setAttribute("aria-pressed", button.dataset.cat === state.category ? "true" : "false");
    });
    Array.prototype.forEach.call(document.getElementById("view-filters").querySelectorAll("button"), function (button) {
      button.setAttribute("aria-pressed", button.dataset.view === state.view ? "true" : "false");
    });
  }

  function recordOf(match) {
    return state.results.matches[match.id] || null;
  }

  function fillPair(node, match, side) {
    var view = logic.pairView(match, side, fixture.matches, state.results);
    var won = logic.winnerSide(match, recordOf(match)) === side;
    node.classList.toggle("winner", won);
    node.textContent = "";
    if (won) {
      var badge = document.createElement("span");
      badge.className = "won";
      badge.textContent = "Ganó";
      node.appendChild(badge);
    }
    var name = document.createElement("span");
    name.className = "pair-name";
    name.textContent = view.label;
    node.appendChild(name);
    if (view.resolved) {
      var slot = document.createElement("span");
      slot.className = "pair-slot";
      slot.textContent = view.raw;
      node.appendChild(slot);
    }
  }

  function renderMatch(match) {
    var card = document.createElement("article");
    card.className = "match cat-" + match.category;
    card.dataset.id = match.id;
    var meta = document.createElement("div");
    meta.className = "match-meta";
    var time = document.createElement("span");
    time.className = "time";
    time.textContent = match.time;
    var chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = match.zona || match.round;
    var court = document.createElement("span");
    court.className = "court";
    court.textContent = match.court;
    meta.appendChild(time);
    meta.appendChild(chip);
    meta.appendChild(court);
    card.appendChild(meta);

    ["pair1", "pair2"].forEach(function (side, index) {
      if (index === 1) {
        var vs = document.createElement("div");
        vs.className = "vs";
        vs.textContent = "vs";
        card.appendChild(vs);
      }
      var node;
      if (state.admin) {
        node = document.createElement("button");
        node.type = "button";
        node.dataset.pick = side;
        node.dataset.id = match.id;
        node.setAttribute("aria-pressed", logic.winnerSide(match, recordOf(match)) === side ? "true" : "false");
      } else {
        node = document.createElement("div");
      }
      node.className = "pair";
      fillPair(node, match, side);
      card.appendChild(node);
    });

    var result = document.createElement("div");
    result.className = "resultado";
    var rec = recordOf(match);
    var score = rec && rec.score ? rec.score : "";
    if (state.admin) {
      var label = document.createElement("label");
      label.className = "score-label";
      label.textContent = "Resultado";
      var input = document.createElement("input");
      input.type = "text";
      input.dataset.score = match.id;
      input.value = score;
      input.placeholder = "6-4 6-3";
      input.autocomplete = "off";
      input.disabled = !!state.saving[match.id];
      label.appendChild(input);
      result.appendChild(label);
      if (rec && (rec.winner || rec.score)) {
        var clear = document.createElement("button");
        clear.type = "button";
        clear.className = "btn btn-clear";
        clear.dataset.clear = match.id;
        clear.textContent = "Borrar resultado";
        clear.disabled = !!state.saving[match.id];
        result.appendChild(clear);
      }
    } else {
      var lab = document.createElement("span");
      lab.className = "resultado-label";
      lab.textContent = "Resultado";
      var value = document.createElement("div");
      value.className = "resultado-value" + (score ? "" : " empty");
      value.textContent = score || "—";
      result.appendChild(lab);
      result.appendChild(value);
    }
    card.appendChild(result);
    var status = state.status[match.id];
    if (state.admin && status) {
      var line = document.createElement("p");
      line.className = "save-status " + status.type;
      line.setAttribute("role", "status");
      line.textContent = status.text;
      card.appendChild(line);
    }
    return card;
  }

  function renderGroups() {
    var groups = logic.buildGroups(fixture.matches)[state.category] || [];
    var list = document.createElement("div");
    list.className = "zona-list";
    groups.forEach(function (group) {
      var card = document.createElement("section");
      card.className = "zona-card cat-" + state.category;
      var heading = document.createElement("h3");
      heading.textContent = group.zona;
      var items = document.createElement("ol");
      group.pairs.forEach(function (pair) {
        var li = document.createElement("li");
        li.textContent = pair;
        items.appendChild(li);
      });
      card.appendChild(heading);
      card.appendChild(items);
      list.appendChild(card);
    });
    return list;
  }

  function render() {
    var cat = catMeta(state.category);
    title.className = "cat-" + state.category;
    if (state.view === "zonas") {
      var groups = logic.buildGroups(fixture.matches)[state.category] || [];
      title.textContent = "Zonas";
      kicker.textContent = cat.label;
      note.textContent = state.loadError || "Parejas como figuran en los partidos del viernes y del sábado. El orden es el de aparición, no una clasificación.";
      panel.textContent = "";
      panel.appendChild(renderGroups());
      if (!groups.length) note.textContent = "No hay zonas para esta categoría.";
    } else {
      var day = dayMeta(state.day);
      var matches = logic.filterMatches(fixture.matches, state.day, state.category);
      title.textContent = "Fixture";
      kicker.textContent = day.label + " " + day.date + " · " + cat.label + " · " + matches.length + (matches.length === 1 ? " partido" : " partidos");
      note.textContent = state.loadError
        ? state.loadError
        : (state.admin
          ? "Tocá la pareja ganadora y escribí el marcador. Se guarda al salir del casillero."
          : (state.day === "domingo"
            ? "Si ya hay ganador en la fase anterior, el nombre reemplaza al cruce (por ejemplo Ganador Semifinal 1)."
            : "Horario, zona, parejas y cancha. El resultado aparece cuando la organización lo carga."));
      var list = document.createElement("div");
      list.className = "match-list";
      matches.forEach(function (match) { list.appendChild(renderMatch(match)); });
      panel.textContent = "";
      panel.appendChild(list);
    }
    syncFilters();
    writeRoute();
  }

  function sameEntry(a, b) {
    if (!a && !b) return true;
    if (!a || !b) return false;
    return (a.winner || "") === (b.winner || "") && (a.score || "") === (b.score || "");
  }

  function buildEntry(winner, score) {
    var entry = {};
    if (winner) entry.winner = winner;
    var text = (score || "").trim();
    if (text) entry.score = text;
    if (!entry.winner && !entry.score) return null;
    return entry;
  }

  function applyPinned(data) {
    Object.keys(state.pinned).forEach(function (id) {
      if (state.pinned[id]) data.matches[id] = state.pinned[id];
      else delete data.matches[id];
    });
    return data;
  }

  var saveChain = Promise.resolve();
  function commit(id, entry) {
    var run = saveChain.then(function () { return flush(id, entry); });
    saveChain = run.then(function () {}, function () {});
    return run;
  }

  async function flush(id, entry) {
    var previous = state.results.matches[id] ? Object.assign({}, state.results.matches[id]) : null;
    if (sameEntry(previous, entry)) return;
    if (entry == null) delete state.results.matches[id];
    else state.results.matches[id] = entry;
    state.pinned[id] = entry;
    state.saving[id] = true;
    state.status[id] = { type: "saving", text: "Guardando…" };
    render();
    try {
      state.results = applyPinned(await store.saveMatch(id, entry));
      state.pinned[id] = entry;
      state.status[id] = { type: "saved", text: entry ? "Guardado" : "Resultado borrado" };
    } catch (error) {
      if (previous) state.results.matches[id] = previous;
      else delete state.results.matches[id];
      state.pinned[id] = previous;
      state.status[id] = { type: "error", text: error.message || "No se pudo guardar." };
    } finally {
      state.saving[id] = false;
      render();
    }
  }

  function showToast(text) {
    var toast = document.getElementById("pin-toast");
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; }, 3500);
  }

  function stripParam(name) {
    var url = new URL(location.href);
    if (!url.searchParams.has(name)) return;
    url.searchParams.delete(name);
    var search = url.searchParams.toString();
    history.replaceState(null, "", url.pathname + (search ? "?" + search : "") + url.hash);
  }

  function enterAdmin() {
    state.admin = true;
    pinForm.hidden = true;
    adminBanner.hidden = false;
    pinInput.value = "";
    render();
  }

  async function unlockPin(pin) {
    try {
      var token = await globalThis.AdminAuth.unlock(pin);
      store.setToken(token);
      enterAdmin();
      return true;
    } catch (ignore) {
      store.clearToken();
      state.admin = false;
      pinInput.value = "";
      return false;
    }
  }

  dayFilters.addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    state.day = button.dataset.day;
    if (state.view === "zonas") state.view = "partidos";
    render();
  });
  catFilters.addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    state.category = button.dataset.cat;
    render();
  });
  document.getElementById("view-filters").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    state.view = button.dataset.view;
    render();
  });

  panel.addEventListener("click", function (event) {
    if (!state.admin) return;
    var pick = event.target.closest("[data-pick]");
    if (pick) {
      var id = pick.dataset.id;
      var match = byId[id];
      var input = panel.querySelector('[data-score="' + id + '"]');
      var score = input ? input.value : ((recordOf(match) || {}).score || "");
      commit(id, buildEntry(match[pick.dataset.pick], score));
      return;
    }
    var clear = event.target.closest("[data-clear]");
    if (clear) commit(clear.dataset.clear, null);
  });

  panel.addEventListener("focusout", function (event) {
    var input = event.target.closest("[data-score]");
    if (!input || !state.admin) return;
    var id = input.dataset.score;
    var next = event.relatedTarget;
    if (next && next.closest && (next.closest('[data-pick][data-id="' + id + '"]') || next.closest('[data-clear="' + id + '"]'))) return;
    var match = byId[id];
    var current = recordOf(match);
    var winner = current && current.winner ? current.winner : "";
    commit(id, buildEntry(winner, input.value));
  });

  panel.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && event.target.matches("[data-score]")) {
      event.preventDefault();
      event.target.blur();
    }
  });

  pinForm.addEventListener("submit", async function (event) {
    event.preventDefault();
    var button = pinForm.querySelector("button");
    button.disabled = true;
    var ok = await unlockPin(pinInput.value);
    button.disabled = false;
    if (!ok) showToast("PIN incorrecto");
  });
  document.getElementById("leave-admin").addEventListener("click", function () {
    store.clearToken();
    state.admin = false;
    location.href = location.pathname + location.hash;
  });

  readRoute();
  buildFilters();
  render();
  (async function bootAdmin() {
    var pin = params.get("pin");
    if (pin !== null) {
      stripParam("pin");
      var ok = await unlockPin(pin);
      if (!ok) showToast("PIN incorrecto");
      return;
    }
    if (store.hasToken()) {
      enterAdmin();
      return;
    }
    if (params.has("admin")) pinForm.hidden = false;
  })();
  store.load().then(function (data) {
    state.results = applyPinned(data);
    state.loadError = "";
    render();
  }).catch(function () {
    state.loadError = "No se pudieron cargar los resultados guardados. Se muestra el fixture sin marcadores.";
    render();
  });
})();
</script>
</body>
</html>
